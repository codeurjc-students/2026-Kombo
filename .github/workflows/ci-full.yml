# Full quality control: runs on every pull request to main.
# Runs all the tests (unit, integration and system) of backend and frontend.
# main is protected so a pull request cannot be merged if this workflow fails.
name: Full quality control

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend:
    name: Full - Backend all tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      # "verify" runs unit tests (*Test) and integration/system tests (*IT).
      # Testcontainers uses the Docker engine of the GitHub runner.
      - name: Run all backend tests
        run: ./mvnw -B verify

      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/target/site/jacoco

  frontend:
    name: Full - Frontend build and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run unit tests
        run: npm test

  e2e:
    name: Full - Frontend integration and UI system tests (docker compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Test-only values, nothing secret. Every "$" of the BCrypt hash (of "admin") is written as "$$"
      # because docker compose reads the .env file and would take "$2b" as a variable.
      - name: Create the .env file
        run: |
          cat > .env <<'ENV'
          KOMBO_DB_PASSWORD=ci-password
          KOMBO_ADMIN_PASSWORD_HASH=$$2b$$10$$GfBhP7nNxexOinn7O4x0w.GfVoH.WobAAFbuerLEUfjiiP43QFFd6
          KOMBO_JWT_SECRET=ci-secret-0123456789-0123456789-0123456789
          KOMBO_SSL_KEY_STORE_PASSWORD=ci-password
          ENV

      # The same image that is published, built from the code of the pull request (not pushed)
      - name: Start the application with docker compose
        run: |
          docker compose --env-file .env -f docker/docker-compose-dev.yml up -d --build
          for i in $(seq 1 60); do
            curl -skf https://localhost/api/v1/products > /dev/null && exit 0
            sleep 3
          done
          echo "The application did not start" && docker compose --env-file .env -f docker/docker-compose-dev.yml logs && exit 1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Vitest "integration" project: real services against the REST API of the container
      - name: Run frontend integration tests
        working-directory: frontend
        env:
          KOMBO_BACKEND_URL: https://localhost
        run: npm run test:integration

      # Selenium tests (*E2E) with headless Chrome, preinstalled on the runner, against the container
      - name: Run UI system tests
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B verify -Pe2e -De2e.baseUrl=https://localhost

      # Screenshot and HTML of the page of every failed Selenium test (E2ETestSupport)
      - name: Upload UI test failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failures
          path: backend/target/e2e-failures
          if-no-files-found: ignore

      - name: Show application logs
        if: failure()
        run: docker compose --env-file .env -f docker/docker-compose-dev.yml logs

      - name: Stop the application
        if: always()
        run: docker compose --env-file .env -f docker/docker-compose-dev.yml down -v
