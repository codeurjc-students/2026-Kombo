# Reusable workflow: builds the Docker image of Kombo and pushes it to DockerHub with the given tags.
# Optionally, it also publishes docker-compose.yml as an OCI artifact.
# It is called by cd.yml, which decides the tags for each trigger, so the build logic is only here.
name: Build and publish Docker image

on:
  workflow_call:
    inputs:
      tags:
        description: Tags of the image, separated by spaces (for example "0.1.0 latest")
        required: true
        type: string
      compose-tag:
        description: If set, docker-compose.yml is published as an OCI artifact with this tag, pointing to the image with the same tag
        required: false
        type: string
        default: ''
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

env:
  IMAGE: deliaml10/kombo
  COMPOSE_ARTIFACT: deliaml10/kombo-compose

jobs:
  publish:
    name: Build and push ${{ inputs.tags }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Turns "0.1.0 latest" into "deliaml10/kombo:0.1.0,deliaml10/kombo:latest"
      - name: Full image names
        id: names
        run: |
          names=""
          for tag in ${{ inputs.tags }}; do
            names="${names:+$names,}$IMAGE:$tag"
          done
          echo "names=$names" >> "$GITHUB_OUTPUT"

      # The GitHub Actions cache keeps the layers (npm and Maven dependencies) between runs
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.names.outputs.names }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # docker-compose.yml points to the version 0.1 image; the published copy points to the image of
      # this release. The values of the variables are not published (no --with-env): Compose only needs
      # placeholders to read the file, and the user provides the real values in their .env file.
      - name: Publish docker-compose.yml as OCI artifact
        if: inputs.compose-tag != ''
        env:
          KOMBO_DB_PASSWORD: placeholder
          KOMBO_ADMIN_PASSWORD_HASH: placeholder
          KOMBO_JWT_SECRET: placeholder
          KOMBO_SSL_KEY_STORE_PASSWORD: placeholder
        run: |
          sed "s|image: $IMAGE:.*|image: $IMAGE:${{ inputs.compose-tag }}|" docker-compose.yml > "$RUNNER_TEMP/docker-compose.yml"
          grep "image: $IMAGE:" "$RUNNER_TEMP/docker-compose.yml"
          docker compose -f "$RUNNER_TEMP/docker-compose.yml" publish -y "$COMPOSE_ARTIFACT:${{ inputs.compose-tag }}"
