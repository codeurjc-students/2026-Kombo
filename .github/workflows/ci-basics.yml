# Basic quality control: runs on every push to a feature branch.
# Builds backend and frontend and runs their unit tests (no Docker or backend needed).
name: Basic quality control

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

jobs:
  backend:
    name: Basic - Backend build and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      # "test" compiles the code and runs only the unit tests (*Test)
      - name: Build and run unit tests
        run: ./mvnw -B test

  frontend:
    name: Basic - Frontend build and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # "npm ci" installs exactly the versions in package-lock.json
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Only the "unit" Vitest project (*.test.jsx, service mocked)
      - name: Run unit tests
        run: npm test