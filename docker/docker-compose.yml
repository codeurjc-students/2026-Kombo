# Kombo version 0.1: image published in DockerHub and MySQL database.
# From the root of the repository (where the .env file is):
#   cp .env.example .env   (and change the values)
#   docker compose --env-file .env -f docker/docker-compose.yml up -d
# The application is at https://localhost (self-signed certificate).
name: kombo

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${KOMBO_DB_PASSWORD:?Set KOMBO_DB_PASSWORD in the .env file}
      MYSQL_DATABASE: kombo
    volumes:
      - db-data:/var/lib/mysql
    # Connects over TCP (127.0.0.1): while MySQL initialises the database it runs a temporary
    # server without networking, so this only succeeds when the real server is ready.
    # "$$" makes Compose pass "$MYSQL_ROOT_PASSWORD" to the container shell instead of replacing it.
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD -e 'SELECT 1' > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  app:
    image: deliaml10/kombo:0.1
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "443:8443"
    environment:
      KOMBO_DB_URL: jdbc:mysql://db:3306/kombo
      KOMBO_DB_PASSWORD: ${KOMBO_DB_PASSWORD}
      KOMBO_ADMIN_EMAIL: ${KOMBO_ADMIN_EMAIL:-admin@kombo.com}
      KOMBO_ADMIN_PASSWORD_HASH: ${KOMBO_ADMIN_PASSWORD_HASH:?Set KOMBO_ADMIN_PASSWORD_HASH in the .env file}
      KOMBO_JWT_SECRET: ${KOMBO_JWT_SECRET:?Set KOMBO_JWT_SECRET in the .env file}
      KOMBO_SSL_KEY_STORE_PASSWORD: ${KOMBO_SSL_KEY_STORE_PASSWORD:?Set KOMBO_SSL_KEY_STORE_PASSWORD in the .env file}
      KOMBO_SAMPLEDATA_ENABLED: ${KOMBO_SAMPLEDATA_ENABLED:-true}
    volumes:
      - certs:/app/certs

volumes:
  db-data:
  certs:
