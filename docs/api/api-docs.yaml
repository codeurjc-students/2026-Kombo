openapi: 3.1.0
info:
  title: Kombo REST API
  description: "REST API for Kombo, a web application for fast food restaurant orders,\
    \ cash register and inventory management."
  version: 0.0.1
servers:
- url: http://localhost:8080
  description: Generated server url
paths:
  /api/v1/products:
    get:
      tags:
      - product-controller
      operationId: getProducts
      parameters:
      - name: category
        in: query
        required: false
        schema:
          type: string
      - name: pageable
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedModelProductDTO"
  /api/v1/products/{id}:
    get:
      tags:
      - product-controller
      operationId: getProduct
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductDetailDTO"
  /api/v1/products/{id}/image:
    get:
      tags:
      - product-controller
      operationId: getProductImage
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
                format: binary
components:
  schemas:
    Pageable:
      type: object
      properties:
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 1
        sort:
          type: array
          items:
            type: string
    PageMetadata:
      type: object
      properties:
        size:
          type: integer
          format: int64
        number:
          type: integer
          format: int64
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int64
    PagedModelProductDTO:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/ProductDTO"
        page:
          $ref: "#/components/schemas/PageMetadata"
    ProductDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        price:
          type: number
        description:
          type: string
        category:
          type: string
    ComboItemDTO:
      type: object
      properties:
        product:
          $ref: "#/components/schemas/ProductDTO"
        quantity:
          type: integer
          format: int32
    ProductDetailDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        price:
          type: number
        description:
          type: string
        category:
          type: string
        combo:
          type: boolean
        ingredients:
          type: array
          items:
            $ref: "#/components/schemas/ProductIngredientDTO"
        products:
          type: array
          items:
            $ref: "#/components/schemas/ComboItemDTO"
    ProductIngredientDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        unit:
          type: string
        quantity:
          type: integer
          format: int32
