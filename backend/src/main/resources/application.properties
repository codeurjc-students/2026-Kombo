spring.application.name=kombo

# Local settings (secrets included) are read from a .env file, which is never committed:
# copy .env.example to .env in the root of the repository. Running from backend/ the file is in "..";
# running the jar from the root it is in ".". Real environment variables take precedence.
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# Database (docker compose overrides these values with SPRING_DATASOURCE_* variables)
spring.datasource.url=${KOMBO_DB_URL:jdbc:mysql://localhost:3306/kombo}
spring.datasource.username=${KOMBO_DB_USERNAME:root}
spring.datasource.password=${KOMBO_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

spring.jpa.open-in-view=false

# Sample data (products, combos, ingredients, users and orders) loaded on startup when the database is empty.
# Disable it to run the application without modifying the database: --kombo.sample-data.enabled=false
kombo.sample-data.enabled=true

# HTTPS on port 443 with a self-signed keystore generated with keytool (see the development guide)
server.port=${SERVER_PORT:443}
server.ssl.enabled=true
server.ssl.key-store=${KOMBO_SSL_KEY_STORE:file:certs/kombo-keystore.p12}
server.ssl.key-store-password=${KOMBO_SSL_KEY_STORE_PASSWORD}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=kombo

# The only administrator. The password is stored as a BCrypt hash, never in plain text
kombo.admin.email=${KOMBO_ADMIN_EMAIL:admin@kombo.com}
kombo.admin.password-hash=${KOMBO_ADMIN_PASSWORD_HASH}

# Key used to sign the session JWT (at least 32 characters) and lifetime of the session (ISO-8601 duration)
kombo.jwt.secret=${KOMBO_JWT_SECRET}
kombo.jwt.expiration=${KOMBO_JWT_EXPIRATION:PT2H}
