spring.application.name=kombo

spring.datasource.url=jdbc:mysql://localhost:3306/kombo
spring.datasource.username=root
spring.datasource.password=password

spring.jpa.hibernate.ddl-auto=update

spring.jpa.open-in-view=false

# Sample data (products, combos, ingredients, users and orders) loaded on startup when the database is empty.
# Disable it to run the application without modifying the database: --kombo.sample-data.enabled=false
kombo.sample-data.enabled=true
