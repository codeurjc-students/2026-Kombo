# Test configuration. Spring Boot reads classpath:/config/application.properties in addition to
# (and with priority over) the main application.properties, so only the values below change.
# None of them is a real secret: they only exist in the tests.

# The database of the tests is the Testcontainers MySQL (@ServiceConnection replaces the connection details)
spring.datasource.password=test

# Throwaway keystore generated by keytool-maven-plugin in target/test-classes (see pom.xml)
server.ssl.key-store=classpath:test-keystore.p12
server.ssl.key-store-password=test-password

# BCrypt hash of "admin"
kombo.admin.email=admin@kombo.com
kombo.admin.password-hash=$2b$10$GfBhP7nNxexOinn7O4x0w.GfVoH.WobAAFbuerLEUfjiiP43QFFd6

kombo.jwt.secret=test-secret-for-the-automated-tests-only-0123456789
